name: Daily Freight Crawler

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants GitHub Actions permission to push fresh JSON back to repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- ADD THIS NEW STEP HERE ---
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      # -----------------------------

      - name: Run Scraper Script
        run: python scraper.py

      - name: Push Cleaned Data Back to GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add fresh_market_data.json
          git commit -m "Auto-update fresh freight data [skip ci]" || exit 0
          git push
